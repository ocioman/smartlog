name: progettotps
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  flutter_svg: ^2.0.9
  http: ^0.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/logo.svg
    - assets/logos/icon.svg
  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeuePro-ExpBd.otf
